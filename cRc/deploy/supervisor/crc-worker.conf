; Supervisor program for the cRc queue worker (notifications are queued jobs, see CLAUDE.md "Notifications").
;
; Install on the server (Ubuntu example):
;   sudo apt install supervisor
;   sudo cp deploy/supervisor/crc-worker.conf /etc/supervisor/conf.d/crc-worker.conf
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start crc-worker:*
;
; Edit before use: `command` and `directory` (the app folder on the server), `user` (the PHP-FPM / file owner),
; and the log path. After every deploy run `php artisan queue:restart` so workers pick up the new code.
; The scheduler is separate: add the cron line `* * * * * cd /var/www/crc && php artisan schedule:run >> /dev/null 2>&1`.

[program:crc-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/crc/artisan queue:work --queue=notifications,default --tries=3 --sleep=3 --max-time=3600
directory=/var/www/crc
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Give a running job time to finish before Supervisor kills it on stop/restart.
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/crc/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
