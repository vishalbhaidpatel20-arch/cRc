; Supervisor program for Laravel Horizon (production only: needs Redis and PHP's pcntl/posix, so not on the Windows dev PC).
; Horizon replaces crc-worker.conf on the server: do NOT run both, they would both take jobs.
;
; Server prerequisites:
;   sudo apt install redis-server php-redis        (or php8.3-redis)
;   .env: QUEUE_CONNECTION=redis  REDIS_CLIENT=phpredis  REDIS_HOST=127.0.0.1  (set REDIS_PASSWORD if Redis is not local-only)
;
; Install:
;   sudo supervisorctl stop crc-worker:*  && sudo rm /etc/supervisor/conf.d/crc-worker.conf   (if it was installed)
;   sudo cp deploy/supervisor/crc-horizon.conf /etc/supervisor/conf.d/crc-horizon.conf
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start crc-horizon
;
; After every deploy run `php artisan horizon:terminate`; Supervisor restarts Horizon on the new code.
; Dashboard: /horizon (active admins only, see HorizonServiceProvider). The scheduler cron line (deploy/cron/crc.cron)
; also runs `horizon:snapshot` every 5 minutes for the metrics graphs.

[program:crc-horizon]
process_name=%(program_name)s
command=php /var/www/crc/artisan horizon
directory=/var/www/crc
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/crc/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; Give running jobs time to finish on stop/restart.
stopwaitsecs=3600
